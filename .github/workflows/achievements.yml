name: achievements

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

jobs:
  achievements:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Generate GitHub Achievements
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}

          user: zero-route
          filename: achievements.svg

          template: classic
          base: ""

          plugin_achievements: yes
          plugin_achievements_display: compact
