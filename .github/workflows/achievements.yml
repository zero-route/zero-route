name: Generate Achievements Trophy

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * *"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Generate Trophy SVG
        uses: ryota0624/github-profile-trophy@master
        with:
          username: zero-route
          filename: achievements.svg

      - name: Commit & Push changes
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "Update achievements trophy SVG"
          file_pattern: "achievements.svg"
